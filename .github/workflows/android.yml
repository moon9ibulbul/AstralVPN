name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: 'gradle'

    - name: Remove stub gradle wrapper if present
      run: |
        if [ -f gradle/wrapper/gradle-wrapper ]; then
          echo "Removing stub gradle/wrapper/gradle-wrapper"
          rm -f gradle/wrapper/gradle-wrapper
        fi

    - name: Install Gradle CLI
      run: |
        sudo apt-get update
        sudo apt-get install -y gradle

    - name: Generate Gradle Wrapper (if missing)
      run: |
        if [ ! -f gradlew ] || [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
          echo "Generating official Gradle Wrapper (8.8)"
          gradle wrapper --gradle-version 8.8
        else
          echo "Gradle Wrapper already present."
        fi

    - name: Ensure gradlew is executable
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew :app:assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      continue-on-error: true
      with:
        name: AstralVPN-debug
        path: app/build/outputs/apk/debug/app-debug.apk
